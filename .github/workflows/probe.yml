name: Probe sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA="TeyvatTracker-data-bot/1.0 (github.com/gleamhairfree/genshin-up)"
          echo "=== seria hoyo-codes ==="
          curl -s -m 20 -A "$UA" "https://hoyo-codes.seria.moe/codes?game=genshin" | head -c 1500; echo
          echo "=== wiki Promotional Code ==="
          curl -s -m 20 -A "$UA" "https://genshin-impact.fandom.com/api.php?action=parse&page=Promotional_Code&prop=wikitext&format=json&formatversion=2" | python3 -c "import json,sys;t=json.load(sys.stdin)['parse']['wikitext'];i=t.find('Code Row');print(len(t));print(t[max(0,i-800):i+2500])"
