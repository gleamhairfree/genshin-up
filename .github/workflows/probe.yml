name: Probe sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA="TeyvatTracker-data-bot/1.0 (github.com/gleamhairfree/genshin-up)"
          for P in "Harmonious_Abundance/2026-11-24" "Myriad_Patterns_Unfold/2026-11-04"; do
            echo "=== $P ==="
            curl -s -A "$UA" "https://genshin-impact.fandom.com/api.php?action=parse&page=$P&prop=wikitext&format=json&formatversion=2" | python3 -c "import json,sys;print(json.load(sys.stdin)['parse']['wikitext'][:1800])"
          done
          echo "=== prefix list ==="
          curl -s -A "$UA" "https://genshin-impact.fandom.com/api.php?action=query&list=categorymembers&cmtitle=Category:Character_Event_Wishes&cmsort=timestamp&cmdir=desc&cmlimit=8&format=json" | head -c 1500; echo
