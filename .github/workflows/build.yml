name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GenshinTracker-ipa
          path: build/GenshinTracker.ipa
          if-no-files-found: error

      - name: Publish as a release (easy download on iPhone)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Teyvat Tracker build ${{ github.run_number }}
          files: build/GenshinTracker.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
