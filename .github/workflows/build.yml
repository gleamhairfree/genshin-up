name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Write Feather / AltStore source
        env:
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: python3 scripts/make_source.py

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GenshinTracker-ipa
          path: |
            build/GenshinTracker.ipa
            build/source.json
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Teyvat Tracker 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: |
            build/GenshinTracker.ipa
            build/source.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
